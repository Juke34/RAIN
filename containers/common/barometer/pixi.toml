[workspace]
name = "rain-barometer"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "==2.2.4"
pandas = "==3.0.1"
scipy = "==1.16.0"
scikit-learn = "==1.8.0"
statsmodels = "==0.14.6"
matplotlib = "==3.10.8"
seaborn = "==0.13.2"
upsetplot = "==0.9.0"
jinja2 = "==3.1.6"
psutil = "==7.2.2"
r-base = "4.4.*"
r-glmmtmb = "*"
r-tmb = "==1.9.19" # must match the TMB version glmmTMB was built against
